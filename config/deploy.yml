# Kamal on skyvim, beside existing apps on kamal-proxy.
# DNS: theasof.com A → 5.78.95.164 (skyvim).
service: as_of
image: as_of

servers:
  web:
    hosts:
      - skyvim
  jobs:
    hosts:
      - skyvim
    cmd: ./bin/lightyear jobs --clock

ssh:
  user: bkkriese

proxy:
  ssl: true
  hosts:
    - theasof.com
    - www.theasof.com
  app_port: 4321
  healthcheck:
    path: /v1/health

volumes:
  - "as_of_storage:/app/storage"

# Images live in a localhost registry on Skyvim (GHCR token lacks write:packages).
registry:
  server: localhost:5555

env:
  clear:
    LIGHTYEAR_ENV: production
    REALM_FQDN: theasof.com
    PUBLIC_BASE_URL: https://theasof.com
    CONTACT_EMAIL: brian@pacrobots.com
    RATE_LIMIT: "1"
    RATE_LIMIT_PER_MIN: "120"
    DEV_FREE: "1"
    X402_ENABLED: "false"
  secret:
    - LIGHTYEAR_MASTER_KEY
    - FRED_API_KEY
    - SITE_PASSWORD

builder:
  arch: amd64
  secrets:
    - lightyear_gem_read_token

aliases:
  doctor: app exec --reuse "./bin/lightyear doctor"
  ledger: app exec --reuse "./bin/lightyear ledger verify"
  console: app exec --interactive --reuse "./bin/lightyear console"
  logs: app logs --follow
