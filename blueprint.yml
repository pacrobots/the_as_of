# frozen shape of As-Of. Ceremony: plan → human go → apply.
lightyear_version: "0.1"
app:
  name: as-of
  summary: The agents' ledger of public record. Dated, hashed, diffable.

domain:
  entities:
    - name: Source
      unique: [content_hash]
      fields:
        - { name: kind, type: string, required: true, one_of: [edgar, federal_register, fred, treasury, irs, fomc, courtlistener, other] }
        - { name: native_id, type: string, required: true }
        - { name: url, type: string, required: true }
        - { name: retrieved_at, type: datetime, required: true }
        - { name: published_at, type: datetime }
        - { name: content_hash, type: string, required: true }
        - { name: bytes, type: integer, required: true }
        - { name: license, type: string, required: true, default: unknown, one_of: [public_domain, us_gov, unknown] }
    - name: Filing
      unique: [accession]
      belongs_to: [source]
      fields:
        - { name: accession, type: string, required: true }
        - { name: cik, type: string, required: true }
        - { name: form, type: string, required: true }
        - { name: filed_at, type: datetime, required: true }
        - { name: company_name, type: string }
        - { name: facts, type: json }
        - { name: claims, type: json }
        - { name: sections, type: json }
    - name: SeriesSnapshot
      unique: [[name, observed_at]]
      belongs_to: [source]
      fields:
        - { name: name, type: string, required: true }
        - { name: value, type: string, required: true }
        - { name: unit, type: string, required: true }
        - { name: vintage, type: string, required: true, one_of: [official, derived, estimated, delayed] }
        - { name: observed_at, type: datetime, required: true }
    - name: Rule
      unique: [code]
      belongs_to:
        - { entity: source, optional: true }
      fields:
        - { name: code, type: string, required: true }
        - { name: title, type: string, required: true }
        - { name: status, type: string, required: true, one_of: [in_force, proposed, withdrawn, unknown] }
        - { name: effective_date, type: date }
        - { name: supersedes, type: json }
        - { name: fragment, type: string }
        - { name: exposures, type: json }
        - { name: open_questions, type: json }
    - name: Customer
      unique: []
      fields:
        - { name: name, type: string }
    - name: CreditKey
      unique: [key_hash]
      belongs_to: [customer]
      fields:
        - { name: key_hash, type: string, required: true }
        - { name: prefix, type: string, required: true }
    - name: Credit
      unique: []
      belongs_to: [customer]
      fields:
        - { name: balance_cents, type: integer, required: true, default: 0 }
    - name: SkuEntitlement
      unique: []
      belongs_to: [customer]
      fields:
        - { name: sku, type: string, required: true, one_of: [consumer, practitioner, seat_pack, meter_only] }
        - { name: brief_cap_month, type: integer }
        - { name: included_cents, type: integer, required: true, default: 0 }
    - name: UsageEvent
      unique: []
      belongs_to: [customer]
      fields:
        - { name: route, type: string, required: true }
        - { name: status, type: integer, required: true }
        - { name: price_cents, type: integer, required: true }
    - name: Watch
      unique: []
      belongs_to: [customer]
      fields:
        - { name: entities, type: json, required: true }
    - name: Brief
      unique: []
      belongs_to:
        - { entity: source, optional: true }
        - { entity: customer, optional: true }
      fields:
        - { name: event_type, type: string, required: true }
        - { name: headline, type: string, required: true }
        - { name: status, type: string, required: true, default: ok, one_of: [ok, low_confidence, corrected] }
        - { name: entities, type: json }
        - { name: jurisdictions, type: json }
        - { name: claims, type: json }
        - { name: numbers, type: json }
        - { name: exposures, type: json }
        - { name: next_dates, type: json }
        - { name: open_questions, type: json }
        - { name: supersedes, type: json }
        - { name: sources_json, type: json }

connections:
  - name: edgar
    source_kind: http
    credential: sec_user_agent
    provides:
      - { verb: "edgar/fetch", resource: accession, impact: low }
  - name: fred
    source_kind: http
    credential: fred_api_key
    provides:
      - { verb: "fred/observations", resource: series_id, impact: low }

skills:
  - name: sources
    provides:
      - { verb: "source/browse", reads: Source }
      - { verb: "source/describe", reads: Source }
  - name: filings
    provides:
      - { verb: "filing/browse", reads: Filing }
      - { verb: "filing/describe", reads: Filing }
  - name: series
    provides:
      - { verb: "series/browse", reads: SeriesSnapshot }
      - { verb: "series/describe", reads: SeriesSnapshot }
  - name: rules
    provides:
      - { verb: "rule/browse", reads: Rule }
      - { verb: "rule/describe", reads: Rule }
  - name: watches
    provides:
      - { verb: "watch/browse", reads: Watch }
      - { verb: "watch/describe", reads: Watch }
  - name: briefs
    provides:
      - { verb: "brief/browse", reads: Brief }
      - { verb: "brief/describe", reads: Brief }

agents:
  - name: EdgarReporter
    kind: practitioner
    readiness: supervised
    charter:
      mission: >
        Cover whitelist issuers. Extract filing headers then facts from source bytes.
        Only use provided text. Never invent numbers. A number not present in source
        bytes is dropped. No advice verbs. No forecasts as asserted claims.
    skills: [filings, sources]
  - name: BriefDesk
    kind: practitioner
    readiness: supervised
    charter:
      mission: >
        Answer brief/query from retrieved sources only. Headline at most 140 characters.
        Only use provided text. Never invent numbers. No advice verbs. No forecasts
        as asserted claims. Corrections append supersedes.
    skills: [briefs, filings, sources, rules, series]
  - name: Clerk
    kind: practitioner
    readiness: supervised
    charter:
      mission: >
        Hold the record desk. Retrieve hashed public-record sources, filing headers,
        official series snapshots, seeded rule pointers, and watch lists.
        Do not extract claims, gloss, brief, or forecast. Unknown → say unknown.
        Do not paraphrase a rule without a pointer.
    skills: [sources, filings, series, rules, watches]
